# Human-readable constraint violation messages (Italian)
# Keys follow pattern: constraint.<constraintId>

# H0: Unassigned lesson
constraint.H0=Lezione {0} ({1}) per {2} non ha timeslot assegnato

# H4.3: Professionalizzanti Single-Day During Stage
constraint.H4.3=Corso professionalizzanti {0} per {1} durante stage ({2} al {3}) usa più giorni della settimana: {4}

# H7: Max Teacher Daily Hours
constraint.H7=Il docente {0} supera il tetto ore giornaliero il {1}: {2} ore, max {3}

# H11: Max Student Group Daily Hours
constraint.H11=La classe {0} supera il tetto ore giornaliero il {1}: {2} ore, max {3}

# M15: Same-day same-subject consecutive (was H15, demoted to medium TASK-392)
constraint.M15=Lezioni {0} non consecutive per {1} il {2} alle {3} e {4}

# S16 (teacher continuity, was H16a) / M37 (room continuity, was H16b hard, demoted TASK-446/447 notte)
constraint.S16=Le ore consecutive di {0} per lo stesso gruppo dovrebbero mantenere lo stesso docente ({1} il {3})
constraint.M37=Le ore consecutive di {0} con {1} il {3} dovrebbero restare nella stessa aula ({2})

# H29: La lezione assegnata deve avere un'aula (TASK-447, era M36 medium). Args: materia, gruppo, orario
constraint.H29={0} di {1} il {2} non ha un'aula assegnata

# H17: Vertically compact (TASK-227, ex M13 - promosso a hard)
constraint.H17=Classe {0} ha {2} gap/i nel suo orario il {1} (giorno non compatto)

# M18: Il giorno deve iniziare dal primo slot aperto da calendario (era H18/task-247, esteso TASK-405)
constraint.M18=Classe {0} inizia {2} slot dopo il primo slot aperto da calendario il {1}

# S1: Minimize teacher gaps
constraint.S1=Docente {0} ha buchi nel suo orario il {1}

# S3: Teacher preference
constraint.S3=Docente {0} ha preferenza contro questo orario: {1} alle {2}

# S7: Reward consecutive student lessons
constraint.S7=Lezioni non consecutive per {0} il {1}

# S8: Isolated student lesson
constraint.S8=Lezione isolata {0} per {1} il {2} (nessuna lezione adiacente)

# S10: Discourage generic lessons in labs
constraint.S10=Materia non-lab {0} in aula lab {1} alle {2}

# S11: Student group room affinity
constraint.S11=Classe {0} ha affinità per un'altra aula: lezione {1} in {2}

# M20: Daily quota fill (target ore attese dal TASK-385, netto dei pin autoritativi TASK-424)
constraint.M20=La classe {0} ha solo {2} delle {3} ore attese il {1}

# M32: Template deviation (TASK-413)
constraint.M32={0} per {1} alle {2} si discosta dalla sua cella del template settimanale

# M33: Surplus beyond expected day hours (TASK-423). Vincolo aggregato per
# giorno: il match non referenzia una singola Lesson, quindi non ha un argument
# builder in ConstraintMessageFormatter (stessa forma di M21/M22/M28).
constraint.M33=Questo giorno della classe ha piu' ore di quante il piano della scuola ne preveda
