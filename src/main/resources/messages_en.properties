# Human-readable constraint violation messages
# Keys follow pattern: constraint.<constraintId>

# H0: Unassigned lesson
constraint.H0=Lesson {0} ({1}) for {2} has no timeslot assigned

# H4.3: Professionalizzanti Single-Day During Stage
constraint.H4.3=Professionalizzanti course {0} for {1} during stage ({2} to {3}) uses multiple days of week: {4}

# H7: Max Teacher Daily Hours
constraint.H7=Teacher {0} exceeds the daily hour cap on {1}: {2} hours, max {3}

# H11: Max Student Group Daily Hours
constraint.H11=Student group {0} exceeds its daily hour cap on {1}: {2} hours, max {3}

# M15: Same-day same-subject consecutive (was H15, demoted to medium TASK-392)
constraint.M15=Non-consecutive {0} lessons for {1} on {2} at {3} and {4}

# S16 (teacher continuity, was H16a) / M37 (room continuity, was H16b hard, demoted TASK-446/447 notte)
constraint.S16=Consecutive {0} lessons for the same group should keep the same teacher ({1} on {3})
constraint.M37=Consecutive {0} lessons by {1} on {3} should keep the same room ({2})

# H29: Assigned lesson must have a room (TASK-447, was M36 medium). Args: subject, group, timeslot
constraint.H29={0} for {1} on {2} has no room assigned

# H17: Vertically compact (TASK-227, formerly M13 - promoted to hard)
constraint.H17=Student group {0} has {2} gap(s) in their schedule on {1} (non-compact day)

# M18: Day should start from first calendar-open slot (was H18/task-247, widened TASK-405)
constraint.M18=Student group {0} starts {2} slot(s) after its first calendar-open slot on {1}

# S1: Minimize teacher gaps
constraint.S1=Teacher {0} has gaps in their schedule on {1}

# S3: Teacher preference
constraint.S3=Teacher {0} has preference against this timeslot: {1} at {2}

# S7: Reward consecutive student lessons
constraint.S7=Non-consecutive lessons for {0} on {1}

# S8: Isolated student lesson
constraint.S8=Isolated {0} lesson for {1} on {2} (no adjacent lessons)

# S10: Discourage generic lessons in labs
constraint.S10=Non-lab subject {0} in lab room {1} at {2}

# S11: Student group room affinity
constraint.S11=Student group {0} has affinity for a different room: {1} lesson in {2}

# M20: Daily quota fill (expected-hours target since TASK-385, net of authoritative pins TASK-424)
constraint.M20=Student group {0} has only {2} of the {3} expected hours on {1}

# M32: Template deviation (TASK-413)
constraint.M32={0} for {1} at {2} deviated from its weekly template cell

# M33: Surplus beyond expected day hours (TASK-423). Day-aggregate constraint:
# its constraint match references no single Lesson, so it has no argument
# builder in ConstraintMessageFormatter (same shape as M21/M22/M28).
constraint.M33=This student group day has more hours than the school's plan expects for it
