# Timefold Solver
quarkus.timefold.solver.solver-config-xml=solverConfig.xml
# Termination is configured in solverConfig.xml (per-phase + global limit)

# STEP_ASSERT for dev mode: catches score corruption bugs during development.
# NON_REPRODUCIBLE for production: no assertions, fastest solving.
# NOTE: PHASE_ASSERT (Timefold default) uses IdentityHashSet for VRP validation,
# which fails with entity-level @ValueRangeProvider on cloned solutions.
# (FAST_ASSERT renamed to STEP_ASSERT, REPRODUCIBLE removed in Timefold 2.0)
%dev.quarkus.timefold.solver.environment-mode=STEP_ASSERT
quarkus.timefold.solver.environment-mode=NON_REPRODUCIBLE

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=planner
quarkus.datasource.password=planner
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/planner
# TASK-541 (22/08, maintainer): update, MAI drop-and-create nel main - il default drop wipe-ava
# il DB a ogni boot senza l'override -D (gamba quarkus:run dei rebuild: due reseeds notturni).
# drop-and-create resta SOLO nel test properties (H2 fresca per test).
quarkus.hibernate-orm.schema-management.strategy=update

# Transaction timeout (5 minutes for pre-assignment validation)
quarkus.transaction-manager.default-transaction-timeout=300

# Batch inserts for seed data performance
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.unsupported-properties."hibernate.order_inserts"=true

# Quinoa (React frontend)
quarkus.quinoa.dev-server.port=3000
quarkus.quinoa.build-dir=dist
quarkus.quinoa.package-manager=npm
quarkus.quinoa.enable-spa-routing=true

# RESTEasy Reactive: Increase output buffer to prevent chunked transfer encoding
# for responses up to 64KB. This avoids HTTP spec violations (Content-Length +
# Transfer-Encoding both present) that can cause curl HTTP/0.9 errors.
# Reference: https://github.com/quarkusio/quarkus/issues/26464
quarkus.rest.output-buffer-size=65536

# HTTP body size limit for schedule import (~13MB exports)
quarkus.http.limits.max-body-size=50M

# CORS. The filter 403s any request bearing an Origin header not in this list, and Chrome
# sends Origin on same-origin module scripts (crossorigin attr) and cors-mode CSS: the
# published https origin MUST be here or Chrome renders a blank page while Firefox (which
# omits Origin on same-origin) works. Diagnosed 2026-08-17 via HAR + direct repro.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,https://planner.example.org,http://laptop.lan:8080

# HTTP compression - RE-ENABLED 26/08 (TASK-561, closes the March TODO).
# The old race ("Response head already sent", headers after body, curl --http0.9)
# is NOT reproducible on the current stack: phase-1 hammering = 6600 concurrent
# requests (3000 static via RootPathHandler + bundle 308KB, 3600 compressed JSON
# REST, 50-60 parallel clients, fresh connection each, header-first asserted at
# the byte on every response): 0 malformations, 0 race lines in the log.
# Stack: Quarkus 3.31.4 + Vert.x 4.5.25 (runtime jars). NOTE: this is a
# BUILD-TIME property (a runtime -D is rejected with "build time fixed");
# and on 3.31.4 the Quinoa static path serves uncompressed regardless - the
# compression that engages (and was hammer-tested clean) is the REST JSON layer.
# Evidence: registro 26/08 TASK-561; original incident commits 601aa94d/337cc4c0.
quarkus.http.enable-compression=true

# Debug logging for rotation testing
quarkus.log.category."com.school.planner.service.RotationTestRunner".level=DEBUG
quarkus.log.category."com.school.planner.service.GreedyRotationAssigner".level=DEBUG
quarkus.log.category."com.school.planner.service.HybridPhase1aService".level=DEBUG
quarkus.log.category."com.school.planner.service.DayAssignmentCsp".level=DEBUG
quarkus.quinoa.ui-dir=src/main/webui
