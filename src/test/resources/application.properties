# Test overrides
# Test-specific solverConfig.xml with fast termination is in src/test/resources/solverConfig.xml

# STEP_ASSERT for tests: validates incremental score calculation matches full recalculation.
# Catches constraint bugs that would otherwise go undetected.
# (Renamed from FAST_ASSERT in Timefold 2.0)
quarkus.timefold.solver.environment-mode=STEP_ASSERT

# Use H2 in-memory for tests (no Docker required)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Disable Quinoa in tests
quarkus.quinoa.enabled=false

# Disable seed data generation in tests (tests create their own minimal data)
planner.datagenerator.enabled=false

# Limit candidate generation for tests (prevent timeouts with large seed data)
planner.phase1a.max-candidates=1000

# Reports resource: point the listing at a throwaway directory so the test does not
# depend on the campaign artifacts being present (ReportsResourceTest seeds it).
planner.reports.dir=target/test-reports

# Golden import under machine pressure legitimately takes minutes (70-300+s
# observed across suite runs on 2026-09-21); the default 300s transaction
# timeout killed it mid-import (suite-tf26). Tests only: production keeps
# the default.
quarkus.transaction-manager.default-transaction-timeout=600
